name: refresh-data

# 每日数据管道：检测 + 抓取 + 汇率 → 写回 data/ → 提交后触发 Pages 重建。
# 站点是静态站，没有服务端定时器，所以「每日核价」靠这条工作流。
on:
  schedule:
    - cron: '0 20 * * *' # UTC 20:00 = 北京 04:00
  workflow_dispatch:

permissions:
  contents: write # 提交刷新后的数据
  actions: write  # dispatch deploy-pages 触发重建（声明 permissions 会覆盖默认集，两个都要显式给）

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node 的 cache: pnpm 需要 pnpm 已在 PATH，所以 pnpm 必须先装
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh daily data (check + scrape + rates)
        run: pnpm run data:refresh

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 每日刷新检测结果与套餐价"
            git push
          fi

      # GITHUB_TOKEN 的 push 不会触发新的工作流（GitHub 防递归设计），
      # 所以这里显式 dispatch 一次 deploy-pages；workflow_dispatch 是官方豁免项。
      - name: Trigger Pages rebuild
        run: gh workflow run deploy-pages --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
